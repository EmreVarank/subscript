version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liscript_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - APP_URL=http://localhost:8080
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@subscript.local}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-subscript}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-subscript}
    volumes:
      - app_data:/app/data
      - ./clips:/app/clips
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: liscript_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subscript}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-subscript}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  app_data:
  postgres_data:
